<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Guardias - DOM y Eventos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <main class="contenedor-principal">
        <header class="encabezado">
            <h1>Simulador de Guardias y Sectores</h1>
            <p>Gestión dinámica de turnos, valores por hora y cupos disponibles</p>
        </header>

        <section class="panel-controles">
            <form id="form-guardia" class="formulario-guardia">
                <div class="campo">
                    <label for="input-sector">Sector / Guardia</label>
                    <input type="text" id="input-sector" placeholder="Ej: Guardia Pediátrica" required>
                </div>

                <div class="campo">
                    <label for="input-valor">Valor por hora ($)</label>
                    <input type="number" id="input-valor" placeholder="Ej: 8000" min="1" required>
                </div>

                <div class="campo">
                    <label for="input-cupos">Cupos disponibles</label>
                    <input type="number" id="input-cupos" placeholder="Ej: 3" min="0" required>
                </div>

                <button type="submit" id="btn-agregar" class="btn btn-primario">+ Agregar</button>
            </form>

            <div class="buscador-zona">
                <label for="input-buscar">Buscar sector (filtra al escribir)</label>
                <input type="text" id="input-buscar" placeholder="Escribí un sector para filtrar...">
            </div>
        </section>

        <div id="feedback-visual" class="feedback oculto" role="status" aria-live="polite"></div>

        <section class="resumen-barra">
            <span>Guardias listadas: <strong id="total-guardias">0</strong></span>
            <span>Suma de valores/hora: <strong id="total-valores">$0</strong></span>
        </section>

        <section id="contenedor-guardias" class="lista-guardias"></section>
    </main>
</body>
</html>
